name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   (update "version" in package.json and CHANGELOG.md, commit)
#   git tag v0.1.1 && git push origin main v0.1.1
#
# Uses npm trusted publishing (OIDC): no npm token or secret is stored anywhere. npm checks
# that the publish comes from this repository and this workflow file, as configured under
# the package's "Trusted Publisher" settings on npmjs.com. Provenance is attached too.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow run (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: |
          npm install -g npm@latest
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is too old for trusted publishing"); process.exit(1); }
          ' "$(npm --version)"

      - run: npm ci

      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Start databases
        run: docker compose up -d --wait

      - name: Full check with every database
        run: npm run check
        env:
          PERMLY_REQUIRE_DB: "1"

      - name: Publish (trusted publishing, with provenance)
        run: npm publish --provenance --access public
